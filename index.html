<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نفسيات NAFSYAT</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Tajawal',sans-serif;
}

body{
    min-height:100vh;
    background:radial-gradient(
        circle at top,
        #3b0717 0%,
        #16050b 45%,
        #050505 100%
    );
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.card{
    width:100%;
    max-width:430px;
    background:linear-gradient(
        180deg,
        #210611 0%,
        #4a0d20 100%
    );
    border:1px solid rgba(212,183,143,.35);
    border-radius:30px;
    padding:45px 25px 30px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

/* الشعار */
.logo{
    width:160px;
    height:160px;
    margin:0 auto 25px;
    border-radius:50%;
    overflow:hidden;
    border:3px solid #D4B78F;
    box-shadow:0 0 25px rgba(212,183,143,.2);
    background:#080808;
}

.logo img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

h1{
    color:#D4B78F;
    font-size:30px;
    font-weight:800;
    margin-bottom:12px;
}

.sub{
    color:#E8DCC8;
    font-size:16px;
    line-height:1.8;
    opacity:.9;
    margin-bottom:30px;
}

.wa-btn{
    width:100%;
    background:#25D366;
    color:white;
    padding:19px 15px;
    border-radius:17px;
    font-size:18px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
    box-shadow:0 10px 25px rgba(37,211,102,.25);
    transition:.2s;
}

.wa-btn:active{
    transform:scale(.98);
}

.number{
    margin-top:20px;
    color:#D4B78F;
    font-size:13px;
    opacity:.7;
}

.line{
    height:1px;
    background:rgba(212,183,143,.15);
    margin:25px 0 18px;
}

.footer{
    color:#D4B78F;
    font-size:12px;
    opacity:.55;
}
</style>
</head>

<body>

<div class="card">

    <!-- الشعار ديالك -->
    <div class="logo">
        <img
            src="IMG-20261008-WA3904.jpg"
            alt="شعار نفسيات NAFSYAT"
        >
    </div>

    <h1>نفسيات NAFSYAT</h1>

    <p class="sub">
        للطلب والاستفسار تواصل معنا مباشرة عبر واتساب
    </p>

    <a
        class="wa-btn"
        href="https://wa.me/212671497919?text=السلام%20عليكم،%20بغيت%20نطلب%20كتاب%20كيف%20تكشف%20المتلاعب%20في%205%20دقائق"
        target="_blank"
    >
        💬 اطلب الآن عبر الواتساب
    </a>

    <div class="number">
        +212 671 497 919
    </div>

    <div class="line"></div>

    <div class="footer">
        © 2026 NAFSYAT – جميع الحقوق محفوظة
    </div>

</div>

</body>
</html>

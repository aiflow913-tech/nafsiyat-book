<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نفسيات NAFSYAT | تواصل معنا</title>

    <meta name="description" content="نفسيات NAFSYAT - تواصل معنا مباشرة عبر واتساب للطلب والاستفسار.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #080808;
            --gold: #D4B78F;
            --light-gold: #E8DCC8;
            --whatsapp: #25D366;
        }

        body {
            min-height: 100vh;
            font-family: 'Tajawal', sans-serif;
            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(110, 20, 45, 0.35),
                    transparent 35%
                ),
                linear-gradient(
                    145deg,
                    #050505 0%,
                    #0A0A0A 45%,
                    #16050A 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
            color: white;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;

            width: 280px;
            height: 280px;

            background: rgba(128, 20, 50, 0.18);

            filter: blur(90px);
            border-radius: 50%;

            top: 10%;
            left: 50%;

            transform: translateX(-50%);

            pointer-events: none;
        }

        .card {
            position: relative;

            width: 100%;
            max-width: 420px;

            padding: 42px 25px 30px;

            text-align: center;

            background:
                linear-gradient(
                    180deg,
                    rgba(35, 7, 14, 0.98),
                    rgba(74, 15, 31, 0.96)
                );

            border-radius: 30px;

            border: 1px solid rgba(212, 183, 143, 0.22);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            animation: cardIn 0.8s ease-out;
        }

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 15%;
            right: 15%;

            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(212, 183, 143, 0.7),
                transparent
            );
        }

        /* الشعار */
        .logo {
            width: 105px;
            height: 105px;

            margin: 0 auto 18px;

            border-radius: 50%;

            border: 2px solid var(--gold);

            overflow: hidden;

            background: #080808;

            box-shadow:
                0 0 0 7px rgba(212, 183, 143, 0.05),
                0 12px 35px rgba(0, 0, 0, 0.45);

            animation: logoIn 1s ease-out;
        }

        .logo img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

        h1 {
            color: var(--gold);

            font-size: 29px;
            font-weight: 800;

            letter-spacing: 0.2px;

            margin-bottom: 9px;
        }

        .sub {
            color: var(--light-gold);

            font-size: 14px;

            line-height: 1.8;

            opacity: 0.85;

            margin-bottom: 28px;
        }

        .wa-btn {
            width: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            padding: 17px 18px;

            background: var(--whatsapp);

            color: white;

            border-radius: 16px;

            text-decoration: none;

            font-size: 16px;
            font-weight: 800;

            box-shadow:
                0 10px 25px rgba(37, 211, 102, 0.18);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .wa-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 30px rgba(37, 211, 102, 0.28);

            filter: brightness(1.05);
        }

        .wa-btn:active {
            transform: scale(0.98);
        }

        .wa-icon {
            font-size: 21px;
            line-height: 1;
        }

        .phone {
            margin-top: 19px;

            color: var(--gold);

            font-size: 12px;

            opacity: 0.55;

            direction: ltr;
        }

        .footer {
            margin-top: 25px;

            padding-top: 17px;

            border-top: 1px solid rgba(212, 183, 143, 0.1);

            color: rgba(232, 220, 200, 0.5);

            font-size: 11px;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes logoIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 380px) {

            body {
                padding: 14px;
            }

            .card {
                padding: 35px 20px 25px;
                border-radius: 25px;
            }

            .logo {
                width: 92px;
                height: 92px;
            }

            h1 {
                font-size: 25px;
            }

            .sub {
                font-size: 13px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <!-- شعار نفسيات -->
        <div class="logo" aria-label="شعار نفسيات">
            <img
                src="logo.jpg"
                alt="شعار نفسيات NAFSYAT"
            >
        </div>

        <h1>نفسيات NAFSYAT</h1>

        <p class="sub">
            للطلب والاستفسار تواصل معنا مباشرة عبر واتساب
        </p>

        <a
            class="wa-btn"
            href="https://wa.me/212671497919?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85%20%D8%B9%D9%84%D9%8A%D9%83%D9%85%20%D8%8C%20%D8%A8%D8%BA%D9%8A%D8%AA%20%D9%86%D8%B7%D9%84%D8%A8%20%D9%83%D8%AA%D8%A7%D8%A8%20%D9%83%D9%8A%D9%81%20%D8%AA%D9%83%D8%B4%D9%81%20%D8%A7%D9%84%D9%85%D8%AA%D9%84%D8%A7%D8%B9%D8%A8%20%D9%81%D9%8A%205%20%D8%AF%D9%82%D8%A7%D8%A6%D9%82"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="الطلب عبر واتساب"
        >
            <span class="wa-icon">💬</span>
            <span>اطلب الآن عبر الواتساب</span>
        </a>

        <p class="phone">
            +212 671 497 919
        </p>

        <div class="footer">
            © 2026 NAFSYAT — جميع الحقوق محفوظة
        </div>

    </main>

</body>
</html>
